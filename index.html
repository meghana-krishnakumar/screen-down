<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScreenDown – Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--card:#fbf9f4;--text:#1f1b16;--muted:#6f685c;--line:#e2dccf;--btn:#141210;--btnText:#fff;--accent:#d4673a;--accent2:#f6e2d3;--danger:#d64545;--shadow:none;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1c18;--card:#2a2621;--text:#f3efe6;--muted:#a39b8d;--line:#3b362e;--btn:#f3efe6;--btnText:#1f1c18;--accent:#e07b4f;--accent2:#40291d;--shadow:none}}
:root[data-theme="dark"]{--bg:#1f1c18;--card:#2a2621;--text:#f3efe6;--muted:#a39b8d;--line:#3b362e;--btn:#f3efe6;--btnText:#1f1c18;--accent:#e07b4f;--accent2:#40291d;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:420px;height:100%;position:relative;overflow:hidden;background:var(--bg)}
@media (min-width:600px){body{align-items:center;background:#1b1e24}#app{height:min(860px,96vh);border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.4)}}
.screen{position:absolute;inset:0;overflow-y:auto;padding:24px 18px;display:flex;flex-direction:column}
h1{font-size:28px;font-weight:800;margin:0 0 8px;letter-spacing:-.8px}h2{font-size:18px;margin:0}
p{color:var(--muted);line-height:1.5;margin:0}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.btn{width:100%;padding:15px;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:16px}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--muted);font-weight:500}
.input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:10px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.emoji{font-size:64px;width:150px;height:150px;border-radius:50%;background:linear-gradient(135deg,#e58a5c,#c4572b);display:grid;place-items:center}
.dots{display:flex;gap:6px;justify-content:center;margin:18px 0}.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}.dots i.on{background:var(--accent);width:22px}
.tabs{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:16px}.tabs button{flex:1;padding:9px;border-radius:10px;background:none;color:var(--muted);font-weight:600}.tabs button.on{background:var(--card);color:var(--text)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:14px 0}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{display:flex;gap:10px;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.big{font-size:46px;font-weight:700;letter-spacing:-1.5px;margin:4px 0}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 12px;align-items:center}
.chip{padding:8px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);white-space:nowrap;font-weight:600;font-size:14px}.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.plus{width:36px;height:36px;border-radius:50%;background:var(--accent2);color:var(--accent);font-size:22px;font-weight:700;flex:none}
.lb{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.lb:last-child{border:0}
.rank{width:20px;color:var(--muted);font-weight:700;text-align:center}
.pill{font-size:11px;background:var(--accent2);color:var(--accent);padding:3px 8px;border-radius:10px;font-weight:700}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sheet{background:var(--bg);width:100%;border-radius:24px 24px 0 0;padding:22px;max-height:85%;overflow-y:auto}
.link{display:flex;gap:8px;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px;align-items:center;justify-content:space-between;font-size:14px;margin:14px 0}
.check{display:flex;align-items:center;gap:12px;padding:10px 0}.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
.fid{position:absolute;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:8}
.fidbox{background:var(--card);border-radius:22px;padding:28px 36px;text-align:center;width:250px}
.demo{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.lbl{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}.stats b{display:block;font-size:20px;letter-spacing:-.5px;margin-top:3px}
.navbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:56px;background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line);z-index:4}
.av{font-weight:600}.burger{margin-left:-12px}.navsp{width:32px}.logo{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-weight:600;font-size:18px;letter-spacing:-.3px;pointer-events:none}
.cta{display:flex;gap:12px}.cta .btn{flex:1;padding:13px 8px;font-size:16px}.cta .btn+.btn{margin-top:0}
.scrim.side{align-items:stretch;justify-content:flex-start}.drawer{width:80%;max-width:320px;height:100%;background:var(--bg);padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;box-shadow:8px 0 30px rgba(0,0,0,.2)}.drawer.in{animation:dr .22s ease-out}@keyframes dr{from{transform:translateX(-100%)}}
.dp{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0 12px}.big-av{width:88px;height:88px;font-size:34px}
.uni{display:flex;flex-direction:column;gap:16px}.uni .tabs{margin:0}.uni .tabs button{font-size:14px;padding:9px 4px}.uni .big{margin:4px 0 8px}
.lb.me{background:var(--accent2);margin:0 -16px;padding:12px 16px;border-radius:12px;border-color:transparent}.empty{display:flex;flex-direction:column;gap:12px;text-align:center;padding:8px 0}
.navbtn{background:none;color:var(--text);font-size:16px;font-weight:500;padding:10px 12px;border-radius:10px;min-height:44px}.navbtn:active{background:var(--line)}


body{font-family:"Avenir Next","Avenir","Nunito Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
b,strong{font-weight:600}
h1{font-size:32px;font-weight:600;letter-spacing:-.4px}
h2{font-size:20px;font-weight:600}
.screen{padding-left:16px;padding-right:16px}
.dash{gap:24px;padding-top:80px;padding-bottom:40px}.dash .chips{padding:0}
.btn{background:var(--btn);color:var(--btnText);border-radius:12px;padding:15px;font-weight:600;font-size:17px}
.btn+.btn{margin-top:12px}
.input{border-radius:12px;padding:14px 16px;font-size:17px;margin-bottom:12px}
.divider{margin:16px 0}
.card{border-radius:16px;padding:16px}
.pill{font-weight:600}
.big{font-size:44px;font-weight:600;letter-spacing:-1px;margin:4px 0 12px}
.lbl{font-weight:600}
.stats{margin-top:16px;padding-top:16px}.stats b{font-size:20px;font-weight:600}
.chip{padding:10px 16px;font-weight:500}.chip.on{background:var(--btn);border-color:var(--btn);color:var(--btnText)}
.plus{width:40px;height:40px;background:var(--btn);color:var(--btnText);font-weight:400}



.rank{font-weight:600}
.dots{margin:24px 0}
.tabs button{font-weight:500}.tabs button.on{font-weight:600}
.sheet{padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
</style>
</head>
<body>
<div id="app"></div>
<script>
var COLORS=["#b45309","#9f1239","#4d7c0f","#0e7490","#a16207","#be123c","#0f766e"];
var POOL=[{name:"Taylor",d:[95,100,104]},{name:"Morgan",d:[270,255,248]},{name:"Riley",d:[138,144,140]}];
var S={screen:"onb",slide:0,tab:"up",faceId:false,user:null,group:"all",sheet:null,toast:null,fid:null,
me:{id:"me",name:"You",d:[240,228,235],pv:[262,241,250]},
friends:[{id:1,name:"Sam",d:[125,132,138]},{id:2,name:"Priya",d:[280,268,260]},{id:3,name:"Jordan",d:[110,118,122]},{id:4,name:"Alex",d:[190,182,176]}],
groups:[],nextId:10,photo:null,fresh:false,period:0};
var SLIDES=[["📱","See your real screen time","Track how much time you spend on social media each day, in one simple number."],
["👯","Compare with friends","Add friends and see who is spending the least time scrolling. A little friendly pressure goes a long way."],
["🏆","Build better habits together","Create groups for roommates, teams or your close circle and cut down together."]];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(m){var h=Math.floor(m/60),r=m%60;return h?h+"h "+r+"m":r+"m"}
function col(id){return COLORS[(typeof id==="number"?id:0)%COLORS.length]}
function toast(t){S.toast=t;render();setTimeout(function(){S.toast=null;render()},1800)}
function go(s){S.screen=s;S.sheet=null;render()}
function setTab(t){S.tab=t;render()}
function next(){if(S.slide<2){S.slide++;render()}else go("auth")}
function auth(kind){
  if(kind==="pw"){var u=document.getElementById("u").value.trim(),p=document.getElementById("p").value;
    if(!u||!p){toast("Enter a username and password");return}S.user=u}
  else S.user="Megan";
  if(!S.faceId){S.sheet="faceprompt"}else go("dash");render()}
function faceLogin(){S.fid="scan";render();setTimeout(function(){S.fid="ok";render();setTimeout(function(){S.fid=null;S.user=S.user||"Megan";go("dash")},700)},1100)}
function enableFace(y){S.faceId=y;S.sheet=null;go("dash");if(y)toast("Face ID enabled")}
function logout(){S.sheet=null;S.screen="auth";render()}
function members(){
  if(S.group==="all")return S.friends;
  var g=S.groups.filter(function(x){return x.id===S.group})[0];
  return g?S.friends.filter(function(f){return g.ids.indexOf(f.id)>-1}):S.friends}
function share(){var link=curLink();
  try{if(navigator.share){navigator.share({title:"Join me",url:"https://"+link});return}}catch(e){}
  try{navigator.clipboard.writeText("https://"+link)}catch(e){}
  toast("Link copied")}
function simFriend(){var p=POOL.shift();if(!p){toast("No more demo friends");return}
  var f={id:S.nextId++,name:p.name,d:p.d},g=curGroup();S.friends.push(f);if(g)g.ids.push(f.id);S.sheet=null;toast(p.name+" joined"+(g?" "+g.name:""));}
function newGroup(){go("newgroup")}
function curGroup(){return S.groups.filter(function(x){return x.id===S.group})[0]||null}
function curLink(){var g=curGroup();return "screentime.app/join/"+(g?g.code:"x7k2")}
function tot(p){return Math.round(p.d[S.period]*[1,7,30][S.period])}
function setPeriod(i){S.period=i;render()}
function createGroup(){var n=document.getElementById("gn").value.trim();
  if(!n){toast("Name your group");return}
  var code=Math.random().toString(36).slice(2,6);
  var g={id:"g"+S.nextId++,name:n,ids:[],code:code};S.groups.push(g);S.group=g.id;go("dash")}
function pick(g){S.group=g;render()}
function avS(bg){return S.photo?"background:url("+S.photo+") center/cover":"background:"+bg}
function openMenu(){S.sheet="menu";S.fresh=true;render();S.fresh=false}
function setPhoto(i){var f=i.files&&i.files[0];if(!f)return;var r=new FileReader();r.onload=function(){S.photo=r.result;render()};r.readAsDataURL(f)}
function drawer(){return '<div class="scrim side" onclick="if(event.target===this){S.sheet=null;render()}"><aside class="drawer'+(S.fresh?' in':'')+'">'+
  '<div class="dp"><div class="av big-av" style="'+avS("var(--accent)")+'">'+(S.photo?"":esc((S.user||"M")[0].toUpperCase()))+'</div><h2>'+esc(S.user||"")+'</h2></div>'+
  '<input type="file" id="ph" accept="image/*" style="display:none" onchange="setPhoto(this)">'+
  '<button class="btn sec" onclick="document.getElementById(\'ph\').click()">Change profile photo</button>'+
  '<div class="sw"><span>Face ID sign-in</span><input type="checkbox" '+(S.faceId?"checked":"")+' style="width:22px;height:22px;accent-color:var(--accent)" onchange="S.faceId=this.checked;render()"></div>'+
  '<button class="btn sec" style="margin-top:auto;color:var(--danger)" onclick="logout()">Log out</button></aside></div>'}

function onb(){var s=SLIDES[S.slide];
  return '<div class="screen"><div class="hero"><div class="emoji">'+s[0]+'</div><h1>'+s[1]+'</h1><p>'+s[2]+'</p></div>'+
  '<div class="dots">'+[0,1,2].map(function(i){return'<i class="'+(i===S.slide?"on":"")+'"></i>'}).join("")+'</div>'+
  '<button class="btn" onclick="next()">'+(S.slide<2?"Next":"Get started")+'</button>'+
  '<button class="btn ghost" onclick="go(\'auth\')">Skip</button></div>'}
function authScr(){var up=S.tab==="up";
  return '<div class="screen"><div style="margin:28px 0 20px"><h1>'+(up?"Create your account":"Welcome back")+'</h1><p>'+(up?"Join in a few seconds.":"Sign in to see how you and your friends are doing.")+'</p></div>'+
  '<div class="tabs"><button class="'+(up?"on":"")+'" onclick="setTab(\'up\')">Sign up</button><button class="'+(up?"":"on")+'" onclick="setTab(\'in\')">Sign in</button></div>'+
  '<button class="btn sec gbtn" onclick="auth(\'g\')"><svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>'+
  (S.faceId&&!up?'<button class="btn sec" style="margin-top:12px" onclick="faceLogin()">🔓 Sign in with Face ID</button>':'')+
  '<div class="divider">or</div>'+
  '<input class="input" id="u" placeholder="Username" autocapitalize="none">'+
  '<input class="input" id="p" type="password" placeholder="Password">'+
  '<button class="btn" onclick="auth(\'pw\')">'+(up?"Create account":"Sign in")+'</button>'+
  '<div class="demo">Prototype: any username and password works.</div></div>'}
function dash(){
  var g=curGroup(),ms=members(),all=[S.me].concat(ms).sort(function(a,b){return tot(a)-tot(b)});
  var PL=["Yesterday","Last 7 days","Last 30 days"],PV=["the day before","the previous 7 days","the previous 30 days"],K=[1,7,30][S.period],mine=tot(S.me),d=Math.round(S.me.pv[S.period]*K)-mine,mx=tot(all[all.length-1]);
  var chips='<button class="chip '+(S.group==="all"?"on":"")+'" onclick="pick(\'all\')">My friends</button>'+
    S.groups.map(function(g){return'<button class="chip '+(S.group===g.id?"on":"")+'" onclick="pick(\''+g.id+'\')">'+esc(g.name)+'</button>'}).join("")+
    '';
  var seg=PL.map(function(l,i){return'<button class="'+(S.period===i?"on":"")+'" onclick="setPeriod('+i+')">'+l+'</button>'}).join("");
  var list=all.map(function(p,i){var w=Math.max(4,Math.round(tot(p)/mx*100));
    return '<div class="lb'+(p.id==="me"?" me":"")+'"><div class="rank">'+(i+1)+'</div><div class="av" style="'+(p.id==="me"?avS("var(--accent)"):"background:"+col(p.id))+'">'+(p.id==="me"&&S.photo?"":esc(p.name[0]))+'</div>'+
    '<div style="flex:1"><div class="row" style="justify-content:space-between"><b>'+esc(p.name)+(i===0?' 👑':'')+'</b><b>'+fmt(tot(p))+'</b></div>'+(S.period?'<p style="font-size:12px">avg '+fmt(Math.round(p.d[S.period]))+'/day</p>':'')+'<div class="bar" style="margin-top:6px"><i style="width:'+w+'%"></i></div></div></div>'}).join("");
  return '<div class="screen dash">'+
  '<div class="cta"><button class="btn" onclick="S.sheet=\'add\';render()">+ Add friends</button><button class="btn" onclick="newGroup()">+ Add group</button></div>'+
  '<div class="card uni"><div class="chips">'+chips+'</div><div class="tabs">'+seg+'</div><div><span class="lbl">Your screen time · sample data</span><div class="big">'+fmt(mine)+'</div><p style="font-size:14px"><b style="color:'+(d>0?"var(--accent)":"var(--danger)")+'">'+(d>0?"↓ ":"↑ ")+fmt(Math.abs(d))+'</b> vs '+PV[S.period]+(K>1?" · avg "+fmt(Math.round(mine/K))+"/day":"")+(ms.length?" · rank #"+(all.indexOf(S.me)+1)+" of "+all.length:"")+'</p></div>'+
  
  
  
  
  (ms.length?'<div>'+list+'</div>':
   '<div class="empty"><p>'+(g?"No friends in "+esc(g.name)+" yet.":"No friends yet.")+'</p><button class="btn" onclick="S.sheet=\'add\';render()">+ '+(g?"Share group link":"Add friends")+'</button></div>')+'</div>'+
  '<div class="demo">Lowest time wins. Numbers are mocked until the Screen Time API is wired up.</div></div>'}
function sheet(){var h="";
  if(S.sheet==="add")h='<h2>'+(curGroup()?"Invite to "+esc(curGroup().name):"Add friends")+'</h2><p style="margin-top:6px">Share your link. When a friend opens it and signs up, they appear '+(curGroup()?"in this group.":"on your dashboard.")+'</p>'+
    '<div class="link"><span>'+curLink()+'</span><button class="pill" onclick="share()">Copy</button></div>'+
    '<button class="btn" onclick="share()">Share link</button>'+
    '<button class="btn sec" style="margin-top:12px" onclick="simFriend()">Demo: simulate a friend joining</button>'+
    '<button class="btn ghost" onclick="S.sheet=null;render()">Close</button>';
  
    
    
    
  if(S.sheet==="faceprompt")h='<h2>Enable Face ID?</h2><p style="margin:6px 0 16px">Sign in faster next time without typing your password.</p><button class="btn" onclick="enableFace(true)">Enable Face ID</button><button class="btn ghost" onclick="enableFace(false)">Not now</button>';
  if(S.sheet==="menu")return drawer();
  return h?'<div class="scrim" onclick="if(event.target===this){S.sheet=null;render()}"><div class="sheet">'+h+'</div></div>':""}
function fidOverlay(){if(!S.fid)return"";
  return '<div class="fid"><div class="fidbox"><div style="font-size:56px">'+(S.fid==="ok"?"✅":"🙂")+'</div><p style="margin-top:10px;color:var(--text)">'+(S.fid==="ok"?"Face ID successful":"Looking for your face…")+'</p></div></div>'}
function navbar(){
  return '<div class="navbar"><button class="navbtn burger" onclick="openMenu()" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="logo"><svg width="26" height="26" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M9 12l7 8 7-8" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ScreenDown</span></div><span class="navsp"></span>'+
  ''+
  ''+
  '</div>'}
function groupScr(){return '<div class="screen"><button class="navbtn" style="align-self:flex-start;margin-left:-12px" onclick="go(\'dash\')">‹ Back</button>'+
  '<div style="margin:16px 0 24px"><h1>Name your group</h1><p style="margin-top:8px">Roommates, study buddies, the group chat. You’ll invite friends with a link next.</p></div>'+
  '<input class="input" id="gn" placeholder="Group name" maxlength="30" onkeydown="if(event.key===\'Enter\')createGroup()">'+
  '<button class="btn" onclick="createGroup()">Create</button></div>'}
function render(){var a=document.getElementById("app"),sc=a.querySelector(".screen"),y=sc?sc.scrollTop:0;
  var h=S.screen==="onb"?onb():S.screen==="auth"?authScr():S.screen==="newgroup"?groupScr():dash();
  a.innerHTML=h+(S.screen==="dash"?navbar():"")+sheet()+fidOverlay()+(S.toast?'<div class="toast">'+esc(S.toast)+'</div>':"");
  var n=a.querySelector(".screen");if(n)n.scrollTop=y;var gi=document.getElementById("gn");if(gi&&S.screen==="newgroup")gi.focus()}
render();
</script>
